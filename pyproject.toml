[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-vault"
version = "0.1.0"
description = "Turn local AI coding agent sessions into a queryable knowledge graph and searchable second brain."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["rag", "knowledge-graph", "ai-agents", "antigravity", "graphify", "developer-tools", "mcp"]
authors = [
    { name = "Aravind Bhati", email = "arvindbhati510@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
graph = [
    "graphifyy>=0.9.70",
]
mcp = [
    "mcp>=1.0.0",
]
all = [
    "graphifyy>=0.9.70",
    "mcp>=1.0.0",
]

[project.scripts]
agent-vault = "agent_vault.cli:main"

[project.urls]
Homepage = "https://github.com/OL-Arvind/agent-vault"
Repository = "https://github.com/OL-Arvind/agent-vault"
Issues = "https://github.com/OL-Arvind/agent-vault/issues"
